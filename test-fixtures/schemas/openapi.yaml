openapi: 3.0.0
info:
  title: Fixture API
  version: 1.0.0
paths:
  /users:
    post:
      summary: Create a user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
components:
  schemas:
    User:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        homeAddress:
          type: string
        deviceId:
          type: string
        notes:
          type: string
